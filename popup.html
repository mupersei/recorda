<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recorda - 녹음 도구</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f5f5f5;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .status {
      font-size: 13px;
      color: #666;
    }

    .status.recording {
      color: #ff4444;
      font-weight: 500;
    }

    .time-display {
      font-size: 30px;
      font-weight: 300;
      color: #333;
      text-align: center;
      margin: 6px 0 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      line-height: 1.1;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 두 개의 선택 항목을 한 줄에 배치. 한쪽이 숨겨지면 남은 쪽이 전체 폭을 차지 */
    .row {
      display: flex;
      gap: 8px;
    }

    .row > .format-selector {
      flex: 1 1 0;
      min-width: 0;
    }

    button {
      padding: 11px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    #recordButton {
      background: #4CAF50;
      color: white;
    }

    #recordButton:hover {
      background: #45a049;
    }

    #recordButton.recording {
      background: #ff4444;
    }

    #recordButton.recording:hover {
      background: #cc0000;
    }

    #recordButton.processing {
      background: #2196F3;
      cursor: wait;
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* 처리 중일 때는 비활성화 상태에서도 파란색 유지 */
    #recordButton.processing:disabled {
      background: #2196F3;
      cursor: wait;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }

    #recordButton:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }

    .message {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: anywhere;
      text-align: center;
      display: none;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .message.info {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
    }

    .message.show {
      display: block;
    }

    /* [개선] 초기 로딩 시 UI 숨김 - 깜빡임 방지 */
    .loading-hidden {
      visibility: hidden;
      opacity: 0;
    }

    /* 로딩 완료 후 페이드인 효과 */
    .loaded {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.15s ease-in-out;
    }

    /* 스켈레톤 로딩 UI */
    .skeleton {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .skeleton-text {
      color: #999;
      font-size: 14px;
    }

    .footer {
      margin-top: 8px;
      text-align: center;
      font-size: 10px;
      color: #aaa;
    }

    .format-selector {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .format-selector label {
      font-size: 12px;
      font-weight: 500;
      color: #666;
    }

    .format-selector select {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .format-selector select:hover {
      border-color: #4CAF50;
    }

    .format-selector select:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
    }

    .format-selector select:disabled {
      background: #f5f5f5;
      cursor: not-allowed;
      border-color: #e0e0e0;
      color: #999;
    }

    .hidden {
      display: none !important;
    }

    .hint {
      font-size: 10px;
      color: #888;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <!-- [개선] 스켈레톤 로딩 UI -->
  <div id="skeleton" class="container skeleton">
    <div class="skeleton-text">로딩 중...</div>
  </div>

  <!-- [개선] 메인 컨테이너 - 초기 숨김 -->
  <div id="mainContainer" class="container loading-hidden">
    <div class="header">
      <h1>Recorda</h1>
      <div id="status" class="status">대기 중</div>
    </div>

    <div id="timeDisplay" class="time-display">00:00</div>

    <div class="controls">
      <div class="format-selector">
        <label for="modeSelect">녹화 모드</label>
        <select id="modeSelect">
          <option value="AUDIO_ONLY" selected>오디오만 녹음</option>
          <option value="VIDEO_AUDIO">영상 + 오디오 (파일 1개)</option>
          <option value="VIDEO_AUDIO_SPLIT">영상 + 오디오, 오디오 별도 저장 (파일 2개)</option>
        </select>
      </div>

      <div class="row">
        <div id="videoFormatGroup" class="format-selector hidden">
          <label for="videoFormatSelect">영상 포맷</label>
          <select id="videoFormatSelect" title="영상 파일의 오디오는 선택한 비트레이트의 MP3로 저장됩니다">
            <option value="mp4" selected>MP4</option>
            <option value="mov">MOV</option>
            <option value="avi">AVI</option>
          </select>
        </div>

        <div id="audioFormatGroup" class="format-selector">
          <label for="formatSelect">오디오 포맷</label>
          <select id="formatSelect">
            <option value="wav" selected>WAV (무손실)</option>
            <option value="mp3">MP3 (압축)</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="format-selector">
          <label for="bitrateSelect">MP3 비트레이트</label>
          <select id="bitrateSelect">
            <option value="128" selected>128 kbps</option>
            <option value="192">192 kbps</option>
            <option value="256">256 kbps</option>
            <option value="320">320 kbps</option>
          </select>
        </div>

        <div class="format-selector">
          <label for="sampleRateSelect">샘플레이트</label>
          <select id="sampleRateSelect">
            <option value="44100" selected>44.1 kHz (CD)</option>
            <option value="48000">48 kHz</option>
          </select>
        </div>
      </div>

      <div id="videoHint" class="hint hidden">영상은 H.264, 영상 파일의 오디오는 선택한 비트레이트의 MP3로 저장됩니다.</div>

      <button id="recordButton">녹화 시작</button>
    </div>

    <div id="message" class="message"></div>

    <div class="footer">
      v1.1.0 | MuPersei
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
